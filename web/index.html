<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BreederNear AI: buy pets direct from trusted local breeders at farm prices. Every listing is checked by AI and clear rules.">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>BreederNear AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2323784a'/><text x='50' y='68' font-size='56' text-anchor='middle'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#pets" aria-label="BreederNear AI home">
      <span class="mark" id="brand-mark" aria-hidden="true"></span>
      <span>BreederNear <small>AI</small></span>
    </a>
    <nav class="top-tabs" id="top-tabs" aria-label="Sections"></nav>
    <span class="pill-btn" id="role-pill" hidden></span>
    <button class="pill-btn" id="district-btn" type="button" aria-label="Change your district"></button>
    <button class="pill-btn" id="cart-btn" type="button" aria-label="Cart"></button>
  </header>

  <main id="main">
    <noscript><p class="disclaimer">BreederNear AI needs JavaScript. Prototype — sample breeders, listings and products. No payments. Not veterinary advice.</p></noscript>
  </main>

  <div class="composer" id="composer" hidden>
    <div class="previews" id="previews" aria-label="Photos to send"></div>
    <form id="chat-form">
      <input type="file" id="chat-file" accept="image/*" multiple hidden>
      <button type="button" class="round attach" id="chat-attach" aria-label="Add photos"></button>
      <label for="chat-input" class="sr-only">Message BreederNear AI</label>
      <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Ask in English or Tamil…"></textarea>
      <button type="submit" class="round send" id="chat-send" aria-label="Send"></button>
    </form>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="panel" role="document">
      <div class="grabber" aria-hidden="true"></div>
      <div class="bar"><h2 id="sheet-title"></h2><button class="icon-btn" type="button" id="sheet-close" aria-label="Close"></button></div>
      <div class="content" id="sheet-content"></div>
      <div class="actions" id="sheet-actions" hidden></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
