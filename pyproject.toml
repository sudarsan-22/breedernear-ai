[project]
name = "breedernear-ai"
version = "0.1.0"
description = "BreederNear AI: find the trusted breeder next door. Gemini + ADK agents on Cloud Run."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls real Google Cloud / Gemini (skipped in CI)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Depends"]
